localization_modes:
  # gps_covariance_threshold: maximum accepted position covariance, unit m^2.
  gps_covariance_threshold: 25.0

  # gps_jump_threshold: maximum accepted GPS position jump between updates, unit m.
  gps_jump_threshold: 3.0

  # Simulation-only GPS shadow regions, in map/odom XY meters.
  # cattle_barn_roof covers the roofed barn area while leaving the outdoor spawn pad outside.
  gps_blocked_regions:
    - id: cattle_barn_roof
      x_min: -3.0
      x_max: 39.0
      y_min: -10.5
      y_max: 10.5

  OUTDOOR:
    # gps_weight: relative GPS influence in outdoor mode.
    gps_weight: 1.0
    lio_weight: 0.6
    wheel_weight: 0.4

  TRANSITION:
    # GPS is gradually reduced near barn entrances or when quality degrades.
    gps_weight: 0.25
    lio_weight: 0.9
    wheel_weight: 0.7

  BARN:
    # GPS is not trusted inside barns.
    gps_weight: 0.0
    lio_weight: 1.0
    wheel_weight: 0.9
