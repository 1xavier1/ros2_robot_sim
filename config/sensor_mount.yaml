# ============================================================
# 传感器标定唯一入口 (实车标定只改这一个文件)
# xacro 通过 xacro.load_yaml 读取本文件生成 URDF; 运行期节点也读这里。
# 约定: xyz 单位 m (X forward positive / Y left positive / Z up positive);
# rpy 单位 rad (Right-hand rule, roll绕X pitch绕Y yaw绕Z); 角度区间 *_min/*_max 单位 rad。
# ============================================================

lidar:                          # 水平 360° 3D 激光雷达 (±15° 竖直, 朝上, 无桅杆)
  parent: base_link
  frame: laser_link
  xyz: [0.0, 0.0, 0.25]         # 低位居中, 无桅杆
  rpy: [0.0, 0.0, 0.0]
  h_samples: 360
  h_min: -3.14159               # 水平 360 deg
  h_max:  3.14159
  v_samples: 32
  v_min: -0.2618                # 竖直 -15 deg (对称, 水平朝上)
  v_max:  0.2618                # +15 deg
  range_min: 0.05
  range_max: 30.0
  update_rate: 10
  topic: velodyne_points

imu:
  parent: base_link
  frame: imu_link
  xyz: [0.0, 0.0, 0.08]
  rpy: [0.0, 0.0, 0.0]

gps:
  parent: base_link
  frame: gps_link
  xyz: [0.0, 0.0, 0.3]
  rpy: [0.0, 0.0, 0.0]

safety:                         # 毫米波近场急停/减速距离, 单位 m
  stop_distance: 0.6
  slowdown_distance: 1.2

mmwave_front:                   # 前向门控毫米波 (转场保底, 推料关闭)
  parent: base_link
  frame: mmwave_front_link
  xyz: [0.275, 0.0, 0.35]
  rpy: [0.0, 0.0, 0.0]          # 朝前
  h_fov: 2.0944                 # 水平 120 deg (+-60)
  v_fov: 0.3491                 # 竖直 20 deg (+-10)
  h_samples: 60
  range_min: 0.3
  range_max: 10.0
  update_rate: 15
  topic: mmwave/front/points
  role: front_guard
  gated_in_push: true           # 推料模式禁用 (前向标记屏蔽)

mmwave_rear_left:               # 左后角毫米波 (倒车近场)
  parent: base_link
  frame: mmwave_rear_left_link
  xyz: [-0.275, 0.19, 0.35]
  rpy: [0.0, 0.0, 2.5307]       # yaw 145 deg
  h_fov: 2.0944
  v_fov: 0.3491
  h_samples: 60
  range_min: 0.3
  range_max: 10.0
  update_rate: 15
  topic: mmwave/rear_left/points
  role: rear_guard
  gated_in_push: false

mmwave_rear_right:              # 右后角毫米波 (倒车近场)
  parent: base_link
  frame: mmwave_rear_right_link
  xyz: [-0.275, -0.19, 0.35]
  rpy: [0.0, 0.0, -2.5307]      # yaw -145 deg (=215)
  h_fov: 2.0944
  v_fov: 0.3491
  h_samples: 60
  range_min: 0.3
  range_max: 10.0
  update_rate: 15
  topic: mmwave/rear_right/points
  role: rear_guard
  gated_in_push: false
